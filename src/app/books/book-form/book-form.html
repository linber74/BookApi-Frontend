<div class="container" style="max-width: 600px;">
  <h2 class="mb-4">{{ isEditMode ? 'Edit Book' : 'Add New Book' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input id="title" type="text" formControlName="title" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="author" class="form-label">Author</label>
      <input id="author" type="text" formControlName="author" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="publishingDate" class="form-label">Publishing Date</label>
      <input id="publishingDate" type="date" formControlName="publishingDate" class="form-control" />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      <i class="fa-solid fa-check"></i> {{ isEditMode ? 'Update' : 'Create' }}
    </button>
    <a routerLink="/" class="btn btn-outline-secondary ms-2">Avbryt</a>
  </form>
</div>
