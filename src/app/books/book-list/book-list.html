<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Books</h2>
  <a routerLink="/books/new" class="btn btn-primary">
    <i class="fa-solid fa-plus"></i> Add new book
  </a>
</div>

<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Published</th>
      <th class="text-end">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (book of books; track book.id) {
      <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.publishingDate }}</td>
        <td class="text-end">
          <a [routerLink]="['/books', book.id]" class="btn btn-sm btn-outline-secondary me-2">
            <i class="fa-solid fa-pen"></i> Edit
          </a>
          <button (click)="deleteBook(book.id)" class="btn btn-sm btn-outline-danger">
            <i class="fa-solid fa-trash"></i> Delete
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
