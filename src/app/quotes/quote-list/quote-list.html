<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Mina citat</h2>
  <a routerLink="/quotes/new" class="btn btn-primary">
    <i class="fa-solid fa-plus"></i> Lägg till nytt citat
  </a>
</div>

<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Citat</th>
      <th class="text-end">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (quote of quotes; track quote.id) {
      <tr>
        <td>{{ quote.text }}</td>
        <td class="text-end">
          <a [routerLink]="['/quotes', quote.id]" class="btn btn-sm btn-outline-secondary me-2">
            <i class="fa-solid fa-pen"></i> Edit
          </a>
          <button (click)="deleteQuote(quote.id)" class="btn btn-sm btn-outline-danger">
            <i class="fa-solid fa-trash"></i> Delete
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
